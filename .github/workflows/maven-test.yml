name: Maven tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: tools/tools-common/pom.xml

      - name: Test tools-common
        run: mvn --batch-mode --no-transfer-progress -f tools/tools-common/pom.xml test
